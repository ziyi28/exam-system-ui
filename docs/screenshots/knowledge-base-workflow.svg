<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">知识库学习与考试保护流程</title>
  <desc id="desc">教师上传和发布资料，学生在非考试时间学习；考试进行中由服务端阻断访问。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.teacher{fill:#eef2ff;stroke:#6366f1}.student{fill:#ecfdf5;stroke:#10b981}.guard{fill:#fff1f2;stroke:#f43f5e}.label{font:600 19px 'Microsoft YaHei',sans-serif;fill:#172554}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="960" height="360" rx="20"/>
  <text x="480" y="42" text-anchor="middle" class="label">AI 知识库：上传、验证、发布与考试保护</text>
  <rect class="card teacher" x="48" y="92" width="190" height="154" rx="16"/>
  <text x="143" y="127" text-anchor="middle" class="label">管理员 / 教师</text>
  <text x="143" y="161" text-anchor="middle" class="small">上传 MD / DOCX / PDF</text>
  <text x="143" y="191" text-anchor="middle" class="small">查看分块预览</text>
  <text x="143" y="221" text-anchor="middle" class="small">确认后发布</text>
  <path class="arrow" d="M240 169 H347"/>
  <rect class="card" x="352" y="92" width="256" height="154" rx="16"/>
  <text x="480" y="127" text-anchor="middle" class="label">可信知识库</text>
  <text x="480" y="161" text-anchor="middle" class="small">异步解析 · 向量索引</text>
  <text x="480" y="191" text-anchor="middle" class="small">引用依据 · 语义检索</text>
  <text x="480" y="221" text-anchor="middle" class="small">仅发布内容可供学生学习</text>
  <path class="arrow" d="M610 146 H717"/>
  <path class="arrow" d="M610 210 H717"/>
  <rect class="card student" x="722" y="92" width="190" height="70" rx="16"/>
  <text x="817" y="123" text-anchor="middle" class="label">非考试时间</text>
  <text x="817" y="148" text-anchor="middle" class="small">可预览与问答学习</text>
  <rect class="card guard" x="722" y="176" width="190" height="70" rx="16"/>
  <text x="817" y="207" text-anchor="middle" class="label">考试进行中</text>
  <text x="817" y="232" text-anchor="middle" class="small">服务端统一拦截</text>
  <text x="480" y="305" text-anchor="middle" class="small">教师先验证来源与答案，学生只访问已发布资料；考试公平不依赖前端隐藏。</text>
</svg>
